---
# PHP is not installed from packages, it is built from source into /opt/php
# (see php-build.sh in inoxio.ispconfig3_customization).

- name: Install required software for Apache
  apt:
    name: "{{ packages }}"
    state: present
    update_cache: yes
  vars:
    packages:
      - apache2
      - apache2-suexec-pristine
      - apache2-utils
      - imagemagick
      - libapache2-mod-fcgid
      - mcrypt
      - memcached

# ----------------Configure apache----------------
- name: Enable apache modules
  apache2_module:
    state: present
    name: '{{ item }}'
  with_items:
    - actions
    - include
    - proxy_fcgi
    - rewrite
    - ssl
    - suexec

- name: Check if httpoxy.conf exists
  stat:
    path: "/etc/apache2/conf-available/httpoxy.conf"
  register: httpoxy_result

- name: Create httpoxy.conf
  file:
    path: "/etc/apache2/conf-available/httpoxy.conf"
    state: touch
  when: not httpoxy_result.stat.exists

- name: Disable http_proxy header
  lineinfile:
    path: /etc/apache2/conf-available/httpoxy.conf
    line: '<IfModule mod_headers.c>'
  when: not httpoxy_result.stat.exists

- name: Disable http_proxy header
  lineinfile:
    path: /etc/apache2/conf-available/httpoxy.conf
    line: '    RequestHeader unset Proxy early'
  when: not httpoxy_result.stat.exists

- name: Disable http_proxy header
  lineinfile:
    path: /etc/apache2/conf-available/httpoxy.conf
    line: '</IfModule>'
  when: not httpoxy_result.stat.exists

- name: Enable httpoxy config
  command: 'a2enconf httpoxy'
  when: not httpoxy_result.stat.exists

- name: Comment application/x-ruby rb
  replace:
    path: /etc/mime.types
    regexp: '^(.*application/x-ruby.*rb)$'
    replace: '#\1'

# ----------------Restart apache----------------
- name: Restart apache
  service:
    name: apache2
    state: restarted
